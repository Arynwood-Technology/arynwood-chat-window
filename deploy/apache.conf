# Apache 2.4: serve the chat from the website's own domain, at https://example.com/chat-window/.
# Enable the modules once:  a2enmod proxy proxy_http headers
# Paste inside the site's existing <VirtualHost *:443>. The page's CSP then needs no new host:
# connect-src 'self' covers the chat, and only the <script> tag needs the page's nonce.
# If the chat server runs on another machine, use its LAN address below and add this web server's
# address to that machine's CHAT_WINDOW_TRUSTED_PROXIES.
<Location "/chat-window/">
    ProxyPass "http://127.0.0.1:8790/" flushpackets=on timeout=300
    ProxyPassReverse "http://127.0.0.1:8790/"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    SetEnv no-gzip 1
    LimitRequestBody 8192
</Location>

# Behind Cloudflare (a2enmod remoteip), so REMOTE_ADDR is the visitor and not Cloudflare:
#   RemoteIPHeader CF-Connecting-IP
#   RemoteIPTrustedProxy <each range listed at https://www.cloudflare.com/ips/>
