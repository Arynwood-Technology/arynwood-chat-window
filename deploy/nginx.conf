# A server block for the chat server. TLS certificates and the server name are yours to fill in.
# Behind Cloudflare, also add Cloudflare's ranges so $remote_addr is the visitor:
#   real_ip_header CF-Connecting-IP;
#   set_real_ip_from <each range from https://www.cloudflare.com/ips/>;

limit_req_zone $binary_remote_addr zone=chatwindow:10m rate=30r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name chat.example.com;
    # ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    client_max_body_size 8k;

    location / {
        limit_req zone=chatwindow burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;              # answers stream
        proxy_read_timeout 300s;
    }
}
