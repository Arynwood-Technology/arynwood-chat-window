# Serve the chat from the website's own domain, at https://example.com/chat-window/.
# Paste inside the site's existing server { } block. With this, the page's CSP needs no new
# host at all: connect-src 'self' covers the chat, and only the <script> tag needs the page's nonce.
# If the chat server runs on another machine, use its LAN address below and add this web server's
# address to that machine's CHAT_WINDOW_TRUSTED_PROXIES.
location /chat-window/ {
    proxy_pass http://127.0.0.1:8790/;          # the trailing slash maps /chat-window/v1/... to /v1/...
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;    # behind Cloudflare, set up real_ip first (see below)
    proxy_buffering off;                        # answers stream word by word
    proxy_read_timeout 300s;
    client_max_body_size 8k;
    gzip off;
}

# Behind Cloudflare, in the http { } block, so $remote_addr is the visitor and not Cloudflare:
#   real_ip_header CF-Connecting-IP;
#   set_real_ip_from <each range listed at https://www.cloudflare.com/ips/>;
