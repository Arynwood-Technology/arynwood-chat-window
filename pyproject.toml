[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arynwood-chat-window"
version = "0.1.0"
description = "A website chat window that answers from the site's own public pages, with a local model."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Arynwood Technology" }]
dependencies = [
    "fastapi~=0.142.2",
    "uvicorn~=0.54.0",
    "httpx~=0.28.1",
    "numpy~=2.5.3",
]

[project.optional-dependencies]
dev = ["pytest~=8.3"]

[project.scripts]
chat-window = "chat_window.cli:main"

[project.urls]
Source = "https://github.com/Arynwood-Technology/arynwood-chat-window"

[tool.setuptools]
packages = ["chat_window"]

[tool.setuptools.package-data]
chat_window = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
